name: Deploy to Cloud Run

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  SERVICE: stockapp-backend
  IMAGE: southamerica-east1-docker.pkg.dev/stockapp-dgbarreto/stockapp/stockapp-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "GCP_SAFE_VERSION=v$(echo "${GITHUB_REF_NAME#v}" | tr '.' '-')" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1024353973147/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@stockapp-dgbarreto.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }} \
            -t ${{ env.IMAGE }}:latest .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ env.RELEASE_VERSION }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},BOLSAI_API_KEY=${{ secrets.BOLSAI_API_KEY }},JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" \
            --set-secrets="JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest"

      - name: Create API Gateway config
        run: |
          gcloud api-gateway api-configs create stockapp-api-config-${{ env.GCP_SAFE_VERSION }} \
            --api=stockapp-api \
            --openapi-spec=api-gateway/openapi.yaml \
            --project=stockapp-dgbarreto

      - name: Update API Gateway
        run: |
          gcloud api-gateway gateways update stockapp-gateway \
            --api=stockapp-api \
            --api-config=stockapp-api-config-${{ env.GCP_SAFE_VERSION }} \
            --location=us-central1 \
            --project=stockapp-dgbarreto